# Windows build check: the team's setup (Qt 6.8.3 MinGW 64-bit, MinGW 13.1, CMake + Ninja).
# Builds in Release with 0 warnings, lints the QML, deploys with windeployqt, runs --selftest and --shot,
# and runs the phase-3 click-through. The app always works on a fresh copy of the committed Data/.
name: Windows build (Qt 6.8.3 MinGW)

on:
  push:
    branches: [feature/gui, main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The exe is a Windows GUI app: send Qt / QML warnings to stderr so the job can see (and fail on) them
  QT_FORCE_STDERR_LOGGING: '1'

jobs:
  build:
    name: Build, deploy, selftest, screenshots
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Keep a pristine copy of the committed Data/
        run: |
          mkdir -p "$RUNNER_TEMP/data_seed"
          cp -r Data/. "$RUNNER_TEMP/data_seed/"
          ls -l "$RUNNER_TEMP/data_seed"

      - name: Install Qt 6.8.3 (MinGW 64-bit kit) + MinGW 13.1 + CMake + Ninja (Qt's own tools, like Qt Creator)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtshadertools'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310 tools_cmake,qt.tools.cmake tools_ninja,qt.tools.ninja'
          cache: true

      - name: Put Qt's MinGW 13.1, CMake and Ninja first on PATH (not the runner's own tools)
        run: |
          TOOLS="$(cygpath -u "$IQTA_TOOLS")"
          # GITHUB_PATH entries added later come first: compiler first of all
          echo "$(cygpath -w "$TOOLS/Ninja")" >> "$GITHUB_PATH"
          echo "$(cygpath -w "$TOOLS/CMake_64/bin")" >> "$GITHUB_PATH"
          echo "$(cygpath -w "$TOOLS/mingw1310_64/bin")" >> "$GITHUB_PATH"
          echo "MINGW_BIN=$TOOLS/mingw1310_64/bin" >> "$GITHUB_ENV"
          echo "QT_TOOLS=$TOOLS" >> "$GITHUB_ENV"

      - name: Check the toolchain matches the Qt kit
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          which g++ cmake ninja
          g++ --version | head -1
          cmake --version | head -1
          case "$(which cmake)" in
            "$QT_TOOLS"/CMake_64/*) echo "OK: cmake comes from the Qt tools" ;;
            *) echo "::error::cmake on PATH is not Qt's CMake"; exit 1 ;;
          esac
          echo "libstdc++-6.dll on PATH (the first one must be Qt's MinGW):"
          for d in $(echo "$PATH" | tr ':' ' '); do [ -f "$d/libstdc++-6.dll" ] && echo "  $d"; done; true
          case "$(which g++)" in
            "$MINGW_BIN"/*) echo "OK: g++ comes from the Qt MinGW 13.1 tools" ;;
            *) echo "::error::g++ on PATH is not the Qt MinGW 13.1 compiler"; exit 1 ;;
          esac
          g++ --version | head -1 | grep -q "13.1.0" || { echo "::error::expected MinGW GCC 13.1.0 (Qt 6.8.3 kit)"; exit 1; }
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake" || { echo "::error::Qt Svg missing"; exit 1; }
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6QuickControls2/Qt6QuickControls2Config.cmake" || { echo "::error::Qt Quick Controls 2 missing"; exit 1; }

      - name: Configure (CMake + Ninja, Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_CXX_COMPILER="$MINGW_BIN/g++.exe" 2>&1 | tee configure.log
          if grep -iE "CMake Warning|warning:" configure.log; then echo "::error::CMake printed warnings"; exit 1; fi

      - name: Build (fail on any error or warning)
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log
          if grep -inE "\bwarning\b" build.log; then echo "::error::the build printed warnings (0-warning rule)"; exit 1; fi
          test -f build/SmartPharmacy.exe

      - name: Lint the QML (qmllint, 0 warnings)
        run: |
          set -o pipefail
          cmake --build build --target all_qmllint 2>&1 | tee qmllint.log
          if grep -nE "Warning:" qmllint.log; then echo "::error::qmllint printed warnings"; exit 1; fi

      - name: Deploy with windeployqt (standalone folder)
        run: |
          mkdir -p deploy
          cp build/SmartPharmacy.exe deploy/
          windeployqt --release --qmldir qml --compiler-runtime deploy/SmartPharmacy.exe 2>&1 | tee windeployqt.log
          ls deploy

      - name: Run --selftest from the deployed folder (Qt and MinGW not on PATH)
        run: |
          rm -rf Data && mkdir Data && cp -r "$RUNNER_TEMP/data_seed/." Data/
          set +e
          env PATH="$(pwd)/deploy:/c/Windows/System32:/c/Windows" ./deploy/SmartPharmacy.exe --selftest > selftest.txt 2>&1
          code=$?
          set -e
          cat selftest.txt
          [ "$code" -eq 0 ] || { echo "::error::--selftest exited with $code"; exit 1; }
          tr -d '\r' < selftest.txt > selftest.clean
          for line in "Admin account created (username: admin)" "SmartPharmacy backend is ready" "Products: 14" "Users: 1" "Promo codes: 2" "Orders: 0"; do
            grep -qxF "$line" selftest.clean || { echo "::error::selftest summary is missing: $line"; exit 1; }
          done
          grep -q "^Data folder: " selftest.clean || { echo "::error::selftest summary is missing the Data folder line"; exit 1; }
          [ "$(wc -l < selftest.clean)" -eq 7 ] || { echo "::error::selftest printed extra lines"; exit 1; }
          echo "selftest OK"

      - name: Probe the GUI start (diagnostic only; Qt platform / RHI / scene graph logging)
        continue-on-error: true
        run: |
          mkdir -p shots/probe
          # run_limited <seconds> <log> <image name> <command...>: runs the command, and if it is still running after
          # <seconds> it saves a gdb backtrace of every thread (<log>.hang-bt.txt), kills it and returns 124
          run_limited() {
            local limit=$1 log=$2 image=$3; shift 3
            "$@" > "$log" 2>&1 &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt "$limit" ]; do sleep 1; waited=$((waited + 1)); done
            if kill -0 "$pid" 2>/dev/null; then
              local winpid
              winpid=$(tasklist //FI "IMAGENAME eq $image" //FO CSV //NH | head -1 | cut -d'"' -f4)
              echo "  still running after ${limit}s (pid $winpid): saving a backtrace"
              "$MINGW_BIN/gdb.exe" -batch -p "$winpid" -ex "info threads" -ex "thread apply all bt 25" > "$log.hang-bt.txt" 2>&1 || true
              taskkill //F //IM "$image" > /dev/null 2>&1 || true
              wait "$pid" 2>/dev/null || true
              return 124
            fi
            wait "$pid"
          }
          for mode in default offscreen software; do
            rm -rf Data && mkdir Data && cp -r "$RUNNER_TEMP/data_seed/." Data/
            case $mode in
              default)   platform=""; backend="" ;;
              offscreen) platform="offscreen"; backend="" ;;
              software)  platform="offscreen"; backend="software" ;;
            esac
            set +e
            run_limited 45 "shots/probe/home-$mode.log" SmartPharmacy.exe \
              env PATH="$(pwd)/deploy:/c/Windows/System32:/c/Windows" QT_QPA_PLATFORM="$platform" QT_QUICK_BACKEND="$backend" \
                  QT_LOGGING_RULES="qt.qpa.*=true;qt.rhi.general=true;qt.scenegraph.general=true" \
                  ./deploy/SmartPharmacy.exe --shot home "shots/probe/home-$mode.png"
            echo "probe [$mode]: exit $?"
            set -e
            tail -25 "shots/probe/home-$mode.log"
            [ -f "shots/probe/home-$mode.log.hang-bt.txt" ] && grep -E "^#|^Thread|^\*" "shots/probe/home-$mode.log.hang-bt.txt" | head -60
          done
          true

      - name: Screenshots with --shot (fail on a non-zero exit or any QML warning)
        timeout-minutes: 30
        run: |
          mkdir -p shots
          : > shots/modes.txt
          fail=0
          # run_limited <seconds> <log> <image name> <command...>: runs the command, and if it is still running after
          # <seconds> it saves a gdb backtrace of every thread (<log>.hang-bt.txt), kills it and returns 124
          run_limited() {
            local limit=$1 log=$2 image=$3; shift 3
            "$@" > "$log" 2>&1 &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt "$limit" ]; do sleep 1; waited=$((waited + 1)); done
            if kill -0 "$pid" 2>/dev/null; then
              local winpid
              winpid=$(tasklist //FI "IMAGENAME eq $image" //FO CSV //NH | head -1 | cut -d'"' -f4)
              echo "  still running after ${limit}s (pid $winpid): saving a backtrace"
              "$MINGW_BIN/gdb.exe" -batch -p "$winpid" -ex "info threads" -ex "thread apply all bt 25" > "$log.hang-bt.txt" 2>&1 || true
              taskkill //F //IM "$image" > /dev/null 2>&1 || true
              wait "$pid" 2>/dev/null || true
              return 124
            fi
            wait "$pid"
          }
          run_shot() {  # $1 = page spec, $2 = file name
            for mode in default offscreen software; do
              rm -rf Data && mkdir Data && cp -r "$RUNNER_TEMP/data_seed/." Data/
              case $mode in
                default)   platform=""; backend="" ;;
                offscreen) platform="offscreen"; backend="" ;;
                software)  platform="offscreen"; backend="software" ;;
              esac
              set +e
              run_limited 60 "shots/$2-$mode.log" SmartPharmacy.exe \
                env PATH="$(pwd)/deploy:/c/Windows/System32:/c/Windows" QT_QPA_PLATFORM="$platform" QT_QUICK_BACKEND="$backend" \
                    ./deploy/SmartPharmacy.exe --shot "$1" "shots/$2.png"
              code=$?
              set -e
              lines=$(grep -c . "shots/$2-$mode.log" || true)
              [ "$code" -eq 124 ] && echo "  (timed out; backtrace in shots/$2-$mode.log.hang-bt.txt)"
              echo "$1 [$mode]: exit $code, $lines output lines"
              if [ "$code" -eq 0 ] && [ "$lines" -eq 0 ] && [ -s "shots/$2.png" ]; then
                echo "$1 $mode" >> shots/modes.txt
                return 0
              fi
              cat "shots/$2-$mode.log"
            done
            echo "::error::--shot $1 failed in every mode"
            fail=1
          }
          run_shot home home
          run_shot shop shop
          run_shot product:P004 product_P004
          run_shot product:P003 product_P003
          run_shot cart cart
          run_shot login login
          run_shot account account
          run_shot admin admin
          echo "--- mode used per screen"; cat shots/modes.txt
          rm -rf Data && mkdir Data && cp -r "$RUNNER_TEMP/data_seed/." Data/
          exit $fail

      - name: Upload the deployed app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartPharmacy-windows-deploy
          path: deploy/
          if-no-files-found: warn

      - name: Upload selftest output, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-selftest-and-shots
          path: |
            selftest.txt
            shots/
            configure.log
            build.log
            qmllint.log
            windeployqt.log
          if-no-files-found: warn

  clickthrough:
    name: Phase-3 click-through (real QML + AppController)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3 (MinGW 64-bit kit) + MinGW 13.1 + CMake + Ninja (Qt's own tools, like Qt Creator)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtshadertools'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310 tools_cmake,qt.tools.cmake tools_ninja,qt.tools.ninja'
          cache: true

      - name: Put Qt's MinGW 13.1, CMake and Ninja first on PATH (not the runner's own tools)
        run: |
          TOOLS="$(cygpath -u "$IQTA_TOOLS")"
          # GITHUB_PATH entries added later come first: compiler first of all
          echo "$(cygpath -w "$TOOLS/Ninja")" >> "$GITHUB_PATH"
          echo "$(cygpath -w "$TOOLS/CMake_64/bin")" >> "$GITHUB_PATH"
          echo "$(cygpath -w "$TOOLS/mingw1310_64/bin")" >> "$GITHUB_PATH"
          echo "MINGW_BIN=$TOOLS/mingw1310_64/bin" >> "$GITHUB_ENV"
          echo "QT_TOOLS=$TOOLS" >> "$GITHUB_ENV"

      - name: Check the toolchain matches the Qt kit
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          which g++ cmake ninja
          g++ --version | head -1
          cmake --version | head -1
          case "$(which cmake)" in
            "$QT_TOOLS"/CMake_64/*) echo "OK: cmake comes from the Qt tools" ;;
            *) echo "::error::cmake on PATH is not Qt's CMake"; exit 1 ;;
          esac
          echo "libstdc++-6.dll on PATH (the first one must be Qt's MinGW):"
          for d in $(echo "$PATH" | tr ':' ' '); do [ -f "$d/libstdc++-6.dll" ] && echo "  $d"; done; true
          case "$(which g++)" in
            "$MINGW_BIN"/*) echo "OK: g++ comes from the Qt MinGW 13.1 tools" ;;
            *) echo "::error::g++ on PATH is not the Qt MinGW 13.1 compiler"; exit 1 ;;
          esac
          g++ --version | head -1 | grep -q "13.1.0" || { echo "::error::expected MinGW GCC 13.1.0 (Qt 6.8.3 kit)"; exit 1; }
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake" || { echo "::error::Qt Svg missing"; exit 1; }
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6QuickControls2/Qt6QuickControls2Config.cmake" || { echo "::error::Qt Quick Controls 2 missing"; exit 1; }

      - name: Write the click-through harness (kept in this workflow so the repo gets no extra files)
        run: |
          mkdir -p "$RUNNER_TEMP/clickthrough"
          cat > "$RUNNER_TEMP/clickthrough/CMakeLists.txt" <<'CMAKE_EOF'
          cmake_minimum_required(VERSION 3.16)
          project(PhaseThreeClickThrough LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(Qt6 6.5 REQUIRED COMPONENTS Core Gui Qml Quick QuickControls2 Svg Test)
          qt_standard_project_setup(REQUIRES 6.5)
          # REPO = the checked-out project; the harness compiles the same backend, AppController and QML module
          file(GLOB BACKEND ${REPO}/Models/*.cpp ${REPO}/Medicine/*.cpp ${REPO}/Inventory/*.cpp ${REPO}/Shopping/*.cpp
                            ${REPO}/Accounts/*.cpp ${REPO}/Repositories/*.cpp ${REPO}/Utils/*.cpp)
          qt_add_executable(ui3 ui3.cpp ${BACKEND})
          target_include_directories(ui3 PRIVATE ${REPO} ${REPO}/Models)
          foreach(f Main Theme Controls ShopPages CheckoutPages AccountPages AdminPages)
            set_source_files_properties(${REPO}/qml/${f}.qml PROPERTIES QT_RESOURCE_ALIAS ${f}.qml)
          endforeach()
          set_source_files_properties(${REPO}/qml/Theme.qml PROPERTIES QT_QML_SINGLETON_TYPE TRUE)
          file(GLOB RES ${REPO}/Resources/images/*.png ${REPO}/Resources/icons/*.svg ${REPO}/Resources/fonts/*.ttf)
          foreach(r ${RES})
            file(RELATIVE_PATH rel ${REPO} ${r})
            set_source_files_properties(${r} PROPERTIES QT_RESOURCE_ALIAS ${rel})
          endforeach()
          qt_add_qml_module(ui3 URI PharmaCare VERSION 1.0
            QML_FILES ${REPO}/qml/Main.qml ${REPO}/qml/Theme.qml ${REPO}/qml/Controls.qml ${REPO}/qml/ShopPages.qml
                      ${REPO}/qml/CheckoutPages.qml ${REPO}/qml/AccountPages.qml ${REPO}/qml/AdminPages.qml
            SOURCES ${REPO}/AppController.h ${REPO}/AppController.cpp
            RESOURCES ${RES})
          target_link_libraries(ui3 PRIVATE Qt6::Core Qt6::Gui Qt6::Qml Qt6::Quick Qt6::QuickControls2 Qt6::Svg Qt6::Test)
          CMAKE_EOF
          cat > "$RUNNER_TEMP/clickthrough/ui3.cpp" <<'UI3_EOF'
          // Throwaway phase-3 UI driver: the real QML + AppController on a copy of Data/, real clicks and typing.
          // Expected money values come from a SEPARATE backend instance (CartManager + PromoCodeManager + CheckoutManager).
          #include <QDir>
          #include <QFile>
          #include <QGuiApplication>
          #include <QStyleHints>
          #include <QJSValue>
          #include <QJsonArray>
          #include <QJsonDocument>
          #include <QJsonObject>
          #include <QQmlApplicationEngine>
          #include <QQuickItem>
          #include <QQuickStyle>
          #include <QQuickWindow>
          #include <QTest>
          #include <QTextStream>
          #include "AppController.h"
          using namespace pharmacy;

          static QStringList g_warnings;
          static void handler(QtMsgType type, const QMessageLogContext&, const QString& msg) {
              if (type == QtWarningMsg || type == QtCriticalMsg || type == QtFatalMsg) g_warnings << msg;
              QTextStream(stderr) << "[qt] " << msg << Qt::endl;
          }
          static QQuickWindow* W = nullptr; static AppController* C = nullptr; static int fails = 0;
          static QString shotDir, dataDir;
          static void check(bool ok, const QString& what) { QTextStream(stdout) << (ok ? "PASS " : "FAIL ") << what << Qt::endl; if (!ok) ++fails; }
          static void step(const QString& s) { QTextStream(stdout) << "STEP " << s << Qt::endl; }
          static void wait(int ms = 400) { QTest::qWait(ms); }
          static void collect(QQuickItem* i, QList<QQuickItem*>& out) { out << i; for (QQuickItem* c : i->childItems()) collect(c, out); }
          static QList<QQuickItem*> allItems() { QList<QQuickItem*> out; QQuickItem* root = W->contentItem(); while (root->parentItem()) root = root->parentItem(); collect(root, out); return out; }
          static bool reallyVisible(QQuickItem* i) { for (QQuickItem* p = i; p; p = p->parentItem()) { if (!p->isVisible() || p->opacity() <= 0.01) return false; } return true; }
          static bool onScreen(QQuickItem* i) { const QPointF p = i->mapToScene(QPointF(i->width()/2, i->height()/2)); return p.x() >= 0 && p.y() >= 0 && p.x() <= W->width() && p.y() <= W->height(); }
          static QQuickItem* flick() { for (QQuickItem* i : allItems()) if (i->objectName() == "shotPage") return i->parentItem()->parentItem(); return nullptr; }
          static void scrollTo(qreal y) { QQuickItem* f = flick(); const qreal maxY = qMax(0.0, f->property("contentHeight").toReal() - f->height()); f->setProperty("contentY", qBound(0.0, y, maxY)); wait(250); }
          static void bringIntoView(QQuickItem* i) {
              QQuickItem* f = flick(); QQuickItem* content = f->property("contentItem").value<QQuickItem*>();
              { bool inside = false; for (QQuickItem* p = i; p; p = p->parentItem()) if (p == content) inside = true; if (!inside) return; }          // header / popup: always on screen
              const qreal cy = i->mapToScene(QPointF(0, i->height()/2)).y(); if (cy > 200 && cy < W->height() - 150) return;
              scrollTo(i->mapToItem(content, QPointF(0, 0)).y() - 300);
          }
          static QQuickItem* findText(const QString& t, bool partial = false, bool needOnScreen = true) {
              QQuickItem* best = nullptr; QPointF bestPos;
              for (QQuickItem* i : allItems()) {
                  if (!i->inherits("QQuickText")) continue;
                  const QString s = i->property("text").toString();
                  if (!(partial ? s.contains(t) : s == t) || !reallyVisible(i)) continue;
                  if (needOnScreen && !onScreen(i)) continue;
                  const QPointF p = i->mapToScene(QPointF(i->width()/2, i->height()/2));
                  if (!best || p.y() < bestPos.y() || (p.y() == bestPos.y() && p.x() < bestPos.x())) { best = i; bestPos = p; }
              }
              return best;
          }
          static QQuickItem* text(const QString& t, bool partial = false) { return findText(t, partial, true); }
          static bool exists(const QString& t, bool partial = false) { return findText(t, partial, false) != nullptr; }
          static QPoint centre(QQuickItem* i) { return i->mapToScene(QPointF(i->width()/2, i->height()/2)).toPoint(); }
          static bool clickText(const QString& t, bool partial = false) {
              QQuickItem* i = findText(t, partial, false);
              if (!i) { check(false, "find text '" + t + "'"); return false; }
              bringIntoView(i); i = findText(t, partial, true);
              if (!i) { check(false, "text on screen '" + t + "'"); return false; }
              QTest::mouseClick(W, Qt::LeftButton, Qt::NoModifier, centre(i)); wait(); return true; }
          static void clickLowest(const QString& t) {
              QQuickItem* best = nullptr;
              for (QQuickItem* i : allItems())
                  if (i->inherits("QQuickText") && i->property("text").toString() == t && reallyVisible(i) && onScreen(i)
                      && (!best || centre(i).y() > centre(best).y())) best = i;
              if (!best) { check(false, "find lowest '" + t + "'"); return; }
              QTest::mouseClick(W, Qt::LeftButton, Qt::NoModifier, centre(best)); wait(); }
          static QQuickItem* field(const QString& placeholder) {
              for (QQuickItem* i : allItems())
                  if (i->property("placeholderText").toString() == placeholder && reallyVisible(i)) return i;
              return nullptr; }
          static void type(const QString& placeholder, const QString& value) {
              QQuickItem* f = field(placeholder);
              if (!f) { check(false, "find field '" + placeholder + "'"); return; }
              bringIntoView(f);
              QTest::mouseClick(W, Qt::LeftButton, Qt::NoModifier, centre(f)); wait(100);
              f->setProperty("text", QString()); for (const QChar ch : value) QTest::keyClick(W, ch.toLatin1()); wait(100);
              if (f->property("text").toString() != value) {
                  QQuickItem* af = W->activeFocusItem();
                  check(false, "typed into '" + placeholder + "': got '" + f->property("text").toString() + "', focus on '"
                        + (af ? af->property("placeholderText").toString() : QString("none")) + "', window active " + QString::number(W->isActive()));
                  W->grabWindow().save(QDir::tempPath() + "/dbg_type.png");
              }
          }
          static void shot(const QString& name) { if (!shotDir.isEmpty()) W->grabWindow().save(shotDir + "/" + name + ".png"); }
          static QJsonArray orders() { QFile f(dataDir + "/orders.json"); if (!f.open(QIODevice::ReadOnly)) return {}; return QJsonDocument::fromJson(f.readAll()).array(); }

          // Expected totals from a separate backend instance on its own copy of the data
          struct Expected { QString subtotal, discount, total; };
          static Expected backendTotals(const QStringList& ids, const QString& code) {
              const QString dir = QDir::tempPath() + "/ui3_expected"; QDir(dir).removeRecursively(); QDir().mkpath(dir);
              for (const char* f : {"products.json","users.json","orders.json","promo_codes.json"}) QFile::copy(dataDir + "/" + f, dir + "/" + f);
              ProductRepository products(dir + "/products.json"); products.load();
              UserRepository users(dir + "/users.json"); users.load();
              OrderRepository orderRepo(dir + "/orders.json"); orderRepo.load();
              PromoCodeRepository promoRepo(dir + "/promo_codes.json"); promoRepo.load();
              InventoryManager inventory(products); CartManager cart(products, inventory); PromoCodeManager promos(promoRepo);
              OrderManager orderManager(orderRepo, inventory);
              CheckoutManager checkout(cart, promos, inventory, products, users, orderManager);
              for (const QString& id : ids) cart.addItem(id, 1);
              const CheckoutTotals t = checkout.previewTotals(code);
              return { AppController::formatEgp(t.subtotalMinor), AppController::formatEgp(-t.discountMinor), AppController::formatEgp(t.finalMinor) };
          }
          static QString backendNextOrderId() {
              OrderRepository orderRepo(dataDir + "/orders.json"); orderRepo.load();
              ProductRepository products(dataDir + "/products.json"); products.load();
              InventoryManager inventory(products); OrderManager om(orderRepo, inventory);
              return om.generateOrderId();
          }

          static QQuickItem* lowestText(const QString& t) {
              QQuickItem* best = nullptr;
              for (QQuickItem* i : allItems())
                  if (i->inherits("QQuickText") && i->property("text").toString() == t && reallyVisible(i) && onScreen(i)
                      && (!best || centre(i).y() > centre(best).y())) best = i;
              return best; }
          static int stockOf(const QString& id) { return C->product(id).value("stock").toInt(); }
          static bool inList(const QVariantList& list, const QString& key, const QString& value) {
              for (const QVariant& v : list) if (v.toMap().value(key).toString() == value) return true; return false; }
          static QString statusOf(const QString& orderId) { return C->order(orderId).value("status").toString(); }
          static void uiLogin(const QString& who, const QString& password) {
              if (C->isLoggedIn()) C->logout();
              C->go("login"); wait(500);
              type("you@example.com", who); type("Your password", password);
              clickLowest("Sign in"); wait(600);
          }
          // Click the action button of one order row in the admin orders list
          static bool clickInRow(const QString& rowText, const QString& button) {
              QQuickItem* row = findText(rowText, true, false);
              if (!row) { check(false, "find row " + rowText); return false; }
              bringIntoView(row); row = findText(rowText, true, true);
              QQuickItem* best = nullptr;
              for (QQuickItem* i : allItems())
                  if (i->inherits("QQuickText") && i->property("text").toString() == button && reallyVisible(i) && onScreen(i)
                      && qAbs(centre(i).y() - centre(row).y()) < 30) best = i;
              if (!best) { check(false, "button '" + button + "' in row " + rowText); return false; }
              QTest::mouseClick(W, Qt::LeftButton, Qt::NoModifier, centre(best)); wait(600); return true;
          }

          int main(int argc, char** argv) {
              qInstallMessageHandler(handler);
              QGuiApplication app(argc, argv);
              QQuickStyle::setStyle("Basic");
              // macOS sends Tab only to text fields unless "Keyboard navigation" is on; test the Windows behaviour (all controls)
              QGuiApplication::styleHints()->setTabFocusBehavior(Qt::TabFocusAllControls);
              if (argc > 1) { shotDir = argv[1]; QDir().mkpath(shotDir); }
              const QString src = QString::fromLocal8Bit(qgetenv("PC_DATA_SRC"));   // the committed Data/ (copied below, never written)
              dataDir = QDir::tempPath() + "/ui3_data"; QDir(dataDir).removeRecursively(); QDir().mkpath(dataDir);
              for (const char* f : {"products.json","users.json","orders.json","promo_codes.json"}) QFile::copy(src + "/" + f, dataDir + "/" + f);
              AppController controller(dataDir); QString err; bool admin;
              if (!controller.initialize(&err, &admin)) return 2;
              AppController::setInstance(&controller); C = &controller;
              QQmlApplicationEngine engine; engine.loadFromModule("PharmaCare", "Main");
              W = qobject_cast<QQuickWindow*>(engine.rootObjects().value(0)); if (!W) return 3;
              W->resize(1440, 900); if (!QTest::qWaitForWindowExposed(W)) return 4; wait(1200);

              if (qEnvironmentVariableIsSet("FOCUSDBG")) {
                  C->go("login"); wait(800);
                  QQuickItem* f = W->activeFocusItem();
                  QTextStream(stdout) << "login focus: " << (f ? f->metaObject()->className() : "none") << " placeholder='" << (f ? f->property("placeholderText").toString() : "") << "'" << Qt::endl;
                  for (QQuickItem* p = f; p; p = p->parentItem()) QTextStream(stdout) << "   " << p->metaObject()->className() << " " << p->objectName() << Qt::endl;
                  return 0;
              }
              // ---------- 1. Route guards (guest / customer) ----------
              step("guards");
              C->go("admin"); wait(300);
              check(C->currentPage() == "login" && C->pageParams().value("next") == "admin", "guest -> admin area goes to Sign in (next = admin)");
              C->go("account"); wait(300);
              check(C->currentPage() == "login" && C->pageParams().value("next") == "account", "guest -> My account goes to Sign in (next = account)");

              // ---------- 2. A customer with an order (register through the UI) ----------
              step("customer + order");
              C->go("register"); wait(500);
              type("Choose a username", "omar"); type("01XXXXXXXXX", "01055556666");
              type("you@example.com", "omar@example.com"); type("At least 8 characters", "Omar@2026");
              clickText("Create account"); wait(600);
              check(C->isLoggedIn() && !C->isAdmin(), "customer omar registered and signed in");
              C->go("admin"); wait(300);
              check(C->currentPage() == "home", "customer -> admin area is refused (home)");
              const int p001Before = stockOf("P001");
              C->addToCart("P001", 2); C->addToCart("P009", 1);
              const QVariantMap placed = C->placeOrder({{"city","Cairo"},{"street","Nile Corniche"},{"building","5"}}, false, false, false);
              const QString orderA = placed.value("orderId").toString();
              C->addToCart("P014", 1);
              const QString orderB = C->placeOrder({{"city","Cairo"},{"street","Nile Corniche"},{"building","5"}}, false, false, false).value("orderId").toString();
              check(!orderA.isEmpty() && !orderB.isEmpty(), "two orders placed: " + orderA + ", " + orderB);
              check(stockOf("P001") == p001Before - 2, "stock P001 went down by 2");
              // My orders
              C->go("account", {{"tab","orders"}}); wait(600);
              check(exists("Order #" + orderA) && exists("Order #" + orderB) && exists("Pending"), "My orders lists both orders as Pending");
              if (!shotDir.isEmpty()) shot("p3_my_orders");

              // ---------- 3. Default admin login (admin / Admin@1234) through the UI ----------
              step("admin login");
              uiLogin("admin", "Admin@1234");
              check(C->isAdmin() && C->currentPage() == "admin", "admin / Admin@1234 signs in and lands on the dashboard");
              check(text("Admin") != nullptr && findText("Cart", false, true) == nullptr, "header shows Admin, no Cart pill");
              check(exists("Revenue", true) && exists("Recent orders") && exists("#" + orderA, true), "dashboard shows the numbers and the recent orders");
              if (!shotDir.isEmpty()) shot("p3_admin_dashboard");

              // ---------- 4. Admins cannot shop ----------
              step("admin cannot shop");
              C->go("product", {{"id","P004"}}); wait(600);
              check(!exists("Add to Cart") && !exists("Buy Now") && exists("Manage in admin"), "PDP: no Add to Cart / Buy Now, 'Manage in admin' instead");
              C->go("shop"); wait(600);
              check(!exists("Add"), "shop cards: no 'Add' buttons");
              C->openQuickView("P004"); wait(500);
              check(!exists("Add to Cart") && exists("View full product details"), "Quick View: no Add to Cart");
              QTest::keyClick(W, Qt::Key_Escape); wait(300);
              const QVariantMap refused = C->addToCart("P004", 1);
              check(!refused.value("ok").toBool() && C->cartCount() == 0, "addToCart refused for an admin: " + refused.value("message").toString());
              C->openCartDrawer(); wait(400);
              check(!exists("Item added to your bag") && !text("Your bag"), "cart drawer does not open for an admin");
              C->go("checkout"); wait(400);
              check(C->currentPage() == "admin", "admin -> checkout redirects to the admin dashboard");
              C->go("cart"); wait(400);
              check(C->currentPage() == "admin", "admin -> cart redirects to the admin dashboard");

              // ---------- 5. Status update by the admin (only valid transitions) ----------
              step("admin status update");
              C->go("admin", {{"tab","orders"}}); wait(600);
              check(!exists("Mark delivered"), "a pending order is not offered 'Mark delivered'");
              const QVariantMap bad = C->updateOrderStatus(orderA, "delivered");
              check(!bad.value("ok").toBool() && statusOf(orderA) == "pending", "pending -> delivered refused: " + bad.value("message").toString());
              clickInRow("#" + orderA + "  ·  omar", "Mark confirmed");
              check(statusOf(orderA) == "confirmed", "admin 'Mark confirmed' -> " + orderA + " is confirmed");
              clickInRow("#" + orderA + "  ·  omar", "Mark processing");
              check(statusOf(orderA) == "processing", orderA + " is processing");
              if (!shotDir.isEmpty()) shot("p3_admin_orders");

              // ---------- 6. Admin adds a product -> it appears in Shop ----------
              step("admin adds product");
              C->go("admin", {{"tab","products"}}); wait(600);
              clickText("Add product"); wait(600);
              check(exists("Product id P015"), "Add product form with the next id P015");
              type("Paracetamol 500 mg Tablets", "Zinc Immune Boost Tablets");
              type("PAR-500", "ZNC-50"); type("Medix", "VitaCore");
              type("325.00", "abc"); type("0", "8"); type("YYYY-MM-DD", "2028-06-30");
              type("Fast relief from headache and fever", "Zinc with vitamin C for daily immune support");
              clickLowest("Add product"); wait(400);
              check(exists("Enter a price above 0, like 325 or 325.50."), "price 'abc' -> price message");
              type("325.00", "450");
              clickLowest("Add product"); wait(400);
              check(exists("Please choose one of the four categories."), "no category -> category message");
              clickText("Choose…"); wait(400);
              clickLowest("Vitamins & Supplements"); wait(300);
              clickLowest("Add product"); wait(700);
              for (QQuickItem* i : allItems()) if (i->property("errorText").isValid() && !i->property("errorText").toString().isEmpty())
                  QTextStream(stdout) << "  form error: " << i->property("errorText").toString() << Qt::endl;
              const QVariantMap added = C->product("P015");
              check(added.value("ok").toBool() && added.value("priceText") == "450.00 EGP" && added.value("stock").toInt() == 8
                    && added.value("brand") == "VitaCore" && added.value("category") == "Vitamins & Supplements", "P015 saved: 450.00 EGP, stock 8, VitaCore, Vitamins");
              if (!shotDir.isEmpty()) shot("p3_admin_products_added");
              C->logout(); C->go("shop", {{"category","Vitamins & Supplements"}}); wait(700);
              check(exists("Zinc Immune Boost Tablets"), "the new product appears in Shop · Vitamins & Supplements");
              C->go("shop", {{"search","zinc"}}); wait(600);
              check(exists("Zinc Immune Boost Tablets") && exists("450.00 EGP"), "search 'zinc' finds it with its price");

              // ---------- 7. Increase stock removes it from low stock ----------
              step("inventory");
              C->login("admin", "Admin@1234"); C->go("admin", {{"tab","inventory"}}); wait(700);
              check(exists("Zinc Immune Boost Tablets") && exists("8 in stock"), "P015 (8) is in low stock (≤ 30)");
              if (!shotDir.isEmpty()) shot("p3_inventory_before");
              {
                  QQuickItem* name = findText("Zinc Immune Boost Tablets", false, false); if (name) { bringIntoView(name); name = text("Zinc Immune Boost Tablets"); }
                  QQuickItem* qty = nullptr;
                  for (QQuickItem* i : allItems())
                      if (name && i->property("placeholderText").toString() == "Qty" && reallyVisible(i) && qAbs(centre(i).y() - centre(name).y()) < 30) qty = i;
                  check(qty != nullptr, "Qty field on the P015 row");
                  if (qty) {
                      QTest::mouseClick(W, Qt::LeftButton, Qt::NoModifier, centre(qty)); wait(100);
                      for (char ch : QByteArray("0")) QTest::keyClick(W, ch);
                      QTest::keyClick(W, Qt::Key_Return); wait(500);
                      check(stockOf("P015") == 8 && exists("Please enter a whole number of at least 1."), "qty 0 -> backend StockResult message, stock unchanged");
                      QTest::mouseClick(W, Qt::LeftButton, Qt::NoModifier, centre(qty)); wait(100);
                      qty->setProperty("text", QString());
                      for (char ch : QByteArray("50")) QTest::keyClick(W, ch);
                      clickInRow("Zinc Immune Boost Tablets", "Add stock");
                  }
              }
              check(stockOf("P015") == 58, "stock is now 58");
              check(!exists("Zinc Immune Boost Tablets") && !inList(C->lowStockProducts(30), "id", "P015"), "P015 left the low-stock list");
              if (!shotDir.isEmpty()) shot("p3_inventory_after");

              // ---------- 8. The admin update is visible in the customer's My orders ----------
              step("customer sees admin update");
              uiLogin("omar", "Omar@2026");
              C->go("account", {{"tab","orders"}}); wait(600);
              {
                  QQuickItem* row = findText("Order #" + orderA, false, false);
                  if (row) bringIntoView(row);
                  bool processingOnRow = false;
                  for (QQuickItem* i : allItems())
                      if (row && i->inherits("QQuickText") && i->property("text").toString() == "Processing" && reallyVisible(i)
                          && qAbs(i->mapToScene(QPointF(0,0)).y() - row->mapToScene(QPointF(0,0)).y()) < 20) processingOnRow = true;
                  check(processingOnRow, "My orders shows " + orderA + " as Processing (set by the admin)");
              }
              clickText("Order #" + orderA); wait(600);
              check(C->currentPage() == "orderDetails" && exists("Pharmacist check") && exists("In progress") && exists("Processing"),
                    "order details: tracker at 'Packed & dispatched · In progress', chip Processing");

              // ---------- 9. Cancel once, never twice ----------
              step("cancel");
              const int p014Before = stockOf("P014");
              C->go("orderDetails", {{"orderId", orderB}}); wait(600);
              check(exists("Need to change something?"), "pending order can be cancelled");
              clickText("Cancel order"); wait(500);
              check(exists("Cancel order #" + orderB + "?"), "confirmation dialog opens");
              if (!shotDir.isEmpty()) shot("p3_cancel_dialog");
              clickText("Keep order"); wait(400);
              check(statusOf(orderB) == "pending", "'Keep order' leaves it pending");
              clickText("Cancel order"); wait(500);
              clickLowest("Cancel order"); wait(700);
              check(statusOf(orderB) == "cancelled" && stockOf("P014") == p014Before + 1, orderB + " cancelled and P014 stock returned");
              check(exists("This order can no longer be cancelled") && exists("This order was cancelled. The items went back into stock."),
                    "details say it can no longer be cancelled");
              clickText("Cancel order"); wait(400);
              check(!exists("Cancel order #" + orderB + "?"), "the Cancel button is disabled now");
              const QVariantMap again = C->cancelMyOrder(orderB);
              check(!again.value("ok").toBool() && statusOf(orderB) == "cancelled" && stockOf("P014") == p014Before + 1,
                    "cancelling again is refused by OrderManager: " + again.value("message").toString());
              if (!shotDir.isEmpty()) shot("p3_order_cancelled");

              // ---------- 10. Profile ----------
              step("profile");
              C->go("account", {{"tab","profile"}}); wait(600);
              type("you@example.com", "not-an-email"); clickText("Save changes"); wait(400);
              check(exists("Please enter a valid email address."), "invalid email -> backend message");
              type("you@example.com", "omar.new@example.com"); type("01XXXXXXXXX", "01122223333");
              type("Cairo", "Alexandria"); clickText("Save changes"); wait(400);
              check(exists("Please complete the address", true) || exists("Complete the address (city, street and building) or leave it empty."),
                    "half address -> address message");
              type("Street name and area", "Fouad Street"); type("12", "9");
              clickText("Save changes"); wait(500);
              const QVariantMap prof = C->currentUserProfile();
              check(exists("Your details have been saved.") && prof.value("email") == "omar.new@example.com" && prof.value("phone") == "01122223333"
                    && prof.value("address").toMap().value("city") == "Alexandria", "profile saved through UserManager::updateProfile");
              if (!shotDir.isEmpty()) shot("p3_profile_saved");

              // ---------- 11. Change password + keyboard (Tab to the button, Enter) ----------
              step("password");
              C->go("account", {{"tab","password"}}); wait(600);
              type("Your current password", "wrong-one"); type("At least 8 characters", "Omar@2027"); type("Type the new password again", "Omar@2027");
              QTest::keyClick(W, Qt::Key_Return); wait(400);
              check(exists("The current password is not correct."), "wrong current password -> backend message (Enter submits)");
              type("Your current password", "Omar@2026"); type("Type the new password again", "Omar@2028");
              QTest::keyClick(W, Qt::Key_Tab); wait(150);
              QQuickItem* focused = W->activeFocusItem();
              check(focused && focused->property("text").toString() == "Change password", "Tab from the last field focuses the 'Change password' button");
              QTest::keyClick(W, Qt::Key_Return); wait(400);
              check(exists("The new passwords do not match."), "Enter on the focused button submits -> mismatch message");
              type("Type the new password again", "Omar@2027"); clickLowest("Change password"); wait(500);
              check(exists("Your password has been changed."), "password changed");
              uiLogin("omar", "Omar@2026");
              check(!C->isLoggedIn(), "old password no longer works");
              uiLogin("omar", "Omar@2027");
              check(C->isLoggedIn() && C->currentPage() == "home", "new password works");

              // ---------- 12. Sign out from the account page ----------
              step("sign out");
              C->go("account"); wait(500);
              clickText("Sign out"); wait(500);
              check(!C->isLoggedIn() && C->currentPage() == "home", "Sign out in the account menu -> signed out, home");

              // ---------- 13. Admin removes the product -> gone from Shop ----------
              step("remove product");
              C->login("admin", "Admin@1234"); C->go("admin", {{"tab","products"}}); wait(600);
              {
                  QQuickItem* name = findText("Zinc Immune Boost Tablets", false, false); if (name) { bringIntoView(name); name = text("Zinc Immune Boost Tablets"); }
                  QQuickItem* trash = nullptr;
                  for (QQuickItem* i : allItems())
                      if (i->property("iconName").toString() == "trash" && reallyVisible(i) && name && qAbs(centre(i).y() - centre(name).y()) < 30) trash = i;
                  check(trash != nullptr, "trash button on the P015 row");
                  if (trash) { QTest::mouseClick(W, Qt::LeftButton, Qt::NoModifier, centre(trash)); wait(500); }
                  check(exists("Remove Zinc Immune Boost Tablets?"), "remove dialog");
                  clickLowest("Remove product"); wait(600);
              }
              check(!C->product("P015").value("ok").toBool(), "P015 removed (AdminManager::removeProduct)");
              C->logout(); C->go("shop", {{"search","zinc"}}); wait(600);
              check(!exists("Zinc Immune Boost Tablets"), "removed product is gone from Shop");

              QTextStream out(stdout);
              out << "Qt/QML warnings: " << g_warnings.size() << Qt::endl;
              for (const QString& w : g_warnings) out << "  WARNING " << w << Qt::endl;
              out << (fails == 0 && g_warnings.isEmpty() ? "UI CHECKS PASSED" : "UI CHECKS FAILED") << Qt::endl;
              return fails == 0 && g_warnings.isEmpty() ? 0 : 1;
          }
          UI3_EOF
          wc -l "$RUNNER_TEMP/clickthrough/"*

      - name: Build the harness (Release)
        run: |
          set -o pipefail
          cmake -S "$RUNNER_TEMP/clickthrough" -B "$RUNNER_TEMP/clickthrough/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DREPO="$(cygpath -m "$GITHUB_WORKSPACE")" \
            -DCMAKE_CXX_COMPILER="$MINGW_BIN/g++.exe"
          cmake --build "$RUNNER_TEMP/clickthrough/build" --parallel 2>&1 | tee clickthrough-build.log

      - name: Run the click-through (55 checks; fails on any check or any Qt/QML warning)
        timeout-minutes: 25
        run: |
          mkdir -p clickthrough-shots
          export PC_DATA_SRC="$(cygpath -w "$GITHUB_WORKSPACE/Data")"
          # run_limited <seconds> <log> <image name> <command...>: runs the command, and if it is still running after
          # <seconds> it saves a gdb backtrace of every thread (<log>.hang-bt.txt), kills it and returns 124
          run_limited() {
            local limit=$1 log=$2 image=$3; shift 3
            "$@" > "$log" 2>&1 &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt "$limit" ]; do sleep 1; waited=$((waited + 1)); done
            if kill -0 "$pid" 2>/dev/null; then
              local winpid
              winpid=$(tasklist //FI "IMAGENAME eq $image" //FO CSV //NH | head -1 | cut -d'"' -f4)
              echo "  still running after ${limit}s (pid $winpid): saving a backtrace"
              "$MINGW_BIN/gdb.exe" -batch -p "$winpid" -ex "info threads" -ex "thread apply all bt 25" > "$log.hang-bt.txt" 2>&1 || true
              taskkill //F //IM "$image" > /dev/null 2>&1 || true
              wait "$pid" 2>/dev/null || true
              return 124
            fi
            wait "$pid"
          }
          result=1
          for attempt in 1 2; do
            set +e
            # Explicit PATH: Qt's MinGW runtime and Qt's DLLs only (Git Bash ships another libstdc++-6.dll)
            run_limited 600 "clickthrough-attempt$attempt.log" ui3.exe \
              env PATH="$MINGW_BIN:$(cygpath -u "$QT_ROOT_DIR")/bin:/c/Windows/System32:/c/Windows" \
                  "$RUNNER_TEMP/clickthrough/build/ui3.exe" clickthrough-shots
            code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 1 ] && [ "$code" -ne 124 ]; then
              echo "  crashed (exit $code): backtrace under gdb"
              PATH="$MINGW_BIN:$(cygpath -u "$QT_ROOT_DIR")/bin:/c/Windows/System32:/c/Windows" \
                "$MINGW_BIN/gdb.exe" -batch -ex run -ex "info threads" -ex "thread apply all bt 30" \
                --args "$(cygpath -w "$RUNNER_TEMP/clickthrough/build/ui3.exe")" clickthrough-shots > "clickthrough-crash-bt$attempt.txt" 2>&1 || true
              grep -E "^#|signal|SIGSEGV|^Thread|^\*" "clickthrough-crash-bt$attempt.txt" | head -50
            fi
            set -e
            grep -E "^(PASS|FAIL)" "clickthrough-attempt$attempt.log" | sort | uniq -c | sort -rn | head -3 || true
            echo "attempt $attempt: exit $code, $(grep -c '^PASS' clickthrough-attempt$attempt.log) pass, $(grep -c '^FAIL' clickthrough-attempt$attempt.log) fail"
            grep -E "^FAIL|WARNING|CHECKS" "clickthrough-attempt$attempt.log" || true
            if [ "$code" -eq 0 ]; then result=0; break; fi
          done
          git status --porcelain Data
          exit $result

      - name: Upload the click-through logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-clickthrough
          path: |
            clickthrough-attempt*.log
            clickthrough-crash-bt*.txt
            clickthrough-build.log
            clickthrough-shots/
          if-no-files-found: warn
